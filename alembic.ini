# Alembic configuration for quant-research-platform.
#
# Run from the repository root, e.g.:  uv run alembic upgrade head
# The database URL is NOT stored here — env.py resolves it from backend
# settings (DATABASE_URL environment variable / .env), see
# backend/db/migrations/env.py.

[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
