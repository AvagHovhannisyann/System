[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Systematic equity research platform (paper-trading only). See DIRECTIVE.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "redis>=5",
    "greenlet>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle — directive §8: every public function documents behavior/units/assumptions
    "DTZ",   # flake8-datetimez
    "ISC",   # implicit string concatenation
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "RUF",   # ruff-specific
]
ignore = [
    "ISC001", # conflicts with the ruff formatter
    "D203",   # incompatible with D211 (blank line before class docstring)
    "D213",   # incompatible with D212 (multi-line summary position)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = [
    "S101", # asserts are the point of tests
    "D1",   # test functions are not public API; docstring enforcement targets shipped code
]
"backend/db/migrations/versions/**" = [
    "D1", # migration revisions carry their message in the docstring template already
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
branch = true
omit = ["backend/db/migrations/*"]

[tool.coverage.report]
show_missing = true
