[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Systematic equity research platform (paper-trading only). See DIRECTIVE.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "redis>=5",
    "greenlet>=3",
    "celery[redis]>=5.4",
    "httpx>=0.27",        # runtime: connector HTTP client (P3.2 EDGAR onward)
    "cryptography>=43",   # runtime: Fernet key encryption at rest (CC.0, §7)
    "itsdangerous>=2.2",  # runtime: signed CSRF tokens (CC.2)
    "numpy>=2.0",         # ML/math stack (§3)
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "cvxpy>=1.5",
    "mlflow>=2.16",       # experiment tracking (I2 reproducibility, CC.3)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.8",
    "celery-types>=0.22",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "dvc>=3.67",           # tooling: data versioning for I2 (CC.3); no backend module imports it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle — directive §8: every public function documents behavior/units/assumptions
    "DTZ",   # flake8-datetimez
    "ISC",   # implicit string concatenation
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports — D-011 layer 3: banned-api on private db internals
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "RUF",   # ruff-specific
]
ignore = [
    "ISC001", # conflicts with the ruff formatter
    "D203",   # incompatible with D211 (blank line before class docstring)
    "D213",   # incompatible with D212 (multi-line summary position)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# D-011 bypass-prevention layer 3 (import contract): the raw engine/sessionmaker
# internals are private to backend/db. Everything else uses the curated surface
# of backend.db: as_of, ingest_writer_session, and the named admin helpers.
"backend.db.engine".msg = "backend.db.engine is private (D-011 layer 3); import as_of / ingest_writer_session / admin helpers from backend.db instead"

[tool.ruff.lint.per-file-ignores]
"backend/db/**" = [
    "TID251", # the db layer itself is the one sanctioned user of its private internals
]
"backend/tests/**" = [
    "S101", # asserts are the point of tests
    "D1",   # test functions are not public API; docstring enforcement targets shipped code
]
"backend/db/migrations/versions/**" = [
    "D1", # migration revisions carry their message in the docstring template already
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Coverage stays opt-in per invocation (`--cov=backend`) rather than living in
# addopts: a floor evaluated over whatever subset of the suite someone happened
# to run is noise, and the whole suite only runs in CI. The floor itself lives
# in [tool.coverage.report].fail_under below.
addopts = "-q"

# ============================================================================
# CC.6 — the coverage ratchet.  DIRECTIVE.md section 8: ">= 85% backend".
#
# WHAT THIS GATE PROVES
#   That at least 85% of the shipped backend's statements *and branches* were
#   executed while the suite ran. Nothing else.
#
# WHAT THIS GATE DOES NOT PROVE  (DIRECTIVE.md section 2, I6 — test honesty)
#   - Not that anything was asserted. A test that imports a module and asserts
#     nothing raises this number and detects no defect. Coverage records
#     execution; only an assertion can fail.
#   - Not that the assertions are about outcomes. Asserting that a call
#     returned *something* still covers every line that call touched.
#   - Not that the uncovered remainder is unimportant. This is a ratio, and
#     the cheapest way to lift a ratio is to test easy code — so the residue
#     drifts towards exactly the error paths that matter. The 15% that this
#     floor tolerates is not a random 15%.
#   - Not that the figure is comparable across commits. It moves when the
#     denominator moves: deleting untested code raises it, and so does
#     excluding an awkward file (see the omit list, which is therefore pinned
#     by backend/tests/test_coverage_ratchet.py).
#   The properties this project actually depends on — I1 temporal integrity,
#   the append-only triggers, "no alpha in pure noise" — are asserted
#   directly, and not one of them would be caught by this gate. Read a pass
#   as the absence of one specific failure, never as evidence of test quality.
#
# HOW THE FLOOR MOVES
#   Up, by hand, on purpose. `fail_under` is a committed constant and is
#   deliberately never derived from the last run: a floor that tracks the
#   current number ratifies whatever a lucky run produced and then punishes
#   every commit after it, which is the opposite of a ratchet. The same number
#   is pinned in backend/tests/test_coverage_ratchet.py, so changing it is a
#   deliberate two-file edit and lowering it quietly is not available.
# ============================================================================
[tool.coverage.run]
source = ["backend"]
# Branch coverage, not lines alone: an `if` whose false arm never runs is
# 100% line-covered and untested. Turning this off would silently soften the
# floor without changing the number beside it.
branch = true
# EXCLUSIONS — two, each justified by what the code *is*, never by how
# awkward it is to test. Pinned by backend/tests/test_coverage_ratchet.py, so
# a third entry is a deliberate two-file edit rather than a quiet carve-out.
omit = [
    # Alembic revisions: append-only historical artifacts run once per
    # environment by `alembic upgrade`, not called by the application, with
    # `downgrade()` arms that by policy never run. What they actually do
    # (hypertables, append-only triggers, indices) is asserted against a live
    # TimescaleDB in backend/tests/integration/ — a stronger check than
    # counting their statements. Left in, every new revision would also
    # dilute the ratio for the code the floor is meant to be about.
    "backend/db/migrations/*",
    # The test package itself. Test modules execute end to end by
    # construction, so leaving them in the denominator pads the total with
    # rows that are ~100% covered whatever the shipped code does. Removing
    # them *lowers* the measured number and points the floor at the code
    # section 8 is asking about; it is a tightening, not a carve-out.
    "backend/tests/*",
]

[tool.coverage.report]
show_missing = true
# The committed floor. Read the ratchet note above before changing it.
fail_under = 85
# coverage compares round(total, precision) < fail_under. At the default
# precision of 0, a real 84.6% rounds to 85 and clears an 85 floor. Two
# decimals makes the floor mean the number written beside it.
precision = 2
