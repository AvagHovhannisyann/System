[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Systematic equity research platform (paper-trading only). See DIRECTIVE.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "redis>=5",
    "greenlet>=3",
    "celery[redis]>=5.4",
    "httpx>=0.27",        # runtime: connector HTTP client (P3.2 EDGAR onward)
    "cryptography>=43",   # runtime: Fernet key encryption at rest (CC.0, §7)
    "itsdangerous>=2.2",  # runtime: signed CSRF tokens (CC.2)
    "numpy>=2.0",         # ML/math stack (§3)
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "cvxpy>=1.5",
    "mlflow>=2.16",       # experiment tracking (I2 reproducibility, CC.3)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.8",
    "celery-types>=0.22",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle — directive §8: every public function documents behavior/units/assumptions
    "DTZ",   # flake8-datetimez
    "ISC",   # implicit string concatenation
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports — D-011 layer 3: banned-api on private db internals
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "RUF",   # ruff-specific
]
ignore = [
    "ISC001", # conflicts with the ruff formatter
    "D203",   # incompatible with D211 (blank line before class docstring)
    "D213",   # incompatible with D212 (multi-line summary position)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# D-011 bypass-prevention layer 3 (import contract): the raw engine/sessionmaker
# internals are private to backend/db. Everything else uses the curated surface
# of backend.db: as_of, ingest_writer_session, and the named admin helpers.
"backend.db.engine".msg = "backend.db.engine is private (D-011 layer 3); import as_of / ingest_writer_session / admin helpers from backend.db instead"

[tool.ruff.lint.per-file-ignores]
"backend/db/**" = [
    "TID251", # the db layer itself is the one sanctioned user of its private internals
]
"backend/tests/**" = [
    "S101", # asserts are the point of tests
    "D1",   # test functions are not public API; docstring enforcement targets shipped code
]
"backend/db/migrations/versions/**" = [
    "D1", # migration revisions carry their message in the docstring template already
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
branch = true
omit = ["backend/db/migrations/*"]

[tool.coverage.report]
show_missing = true
