name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: No-fabrication guard (CC.8 — I3: no mock/synthetic identifiers in backend/ingest)
        run: uv run python scripts/check_no_fabrication.py
      - name: Typecheck (strict)
        run: uv run mypy backend
      - name: Tests (xfails forced to run)
        run: uv run pytest --runxfail --cov=backend --cov-report=term --junitxml=/tmp/junit.xml
      - name: Test-honesty guard (I6 — a skipped test counts as a failure)
        run: |
          uv run python -c "
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/junit.xml').getroot()
          skipped = sum(int(s.get('skipped', 0)) for s in root.iter('testsuite'))
          if skipped:
              sys.exit(f'I6 violation: {skipped} skipped test(s) — DIRECTIVE.md section 2 I6')
          print('I6 guard: zero skipped tests')
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (clean)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v -E '\.env\.example$'; then
            echo "::error::.env file is tracked in git — secrets must never be committed (I5)"; exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pip-audit (locked runtime deps)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm dependency audit (high+, committed allowlist with justifications)
        working-directory: frontend
        run: npx --yes audit-ci --config audit-ci.jsonc
