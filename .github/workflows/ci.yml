name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck (strict)
        run: uv run mypy backend
      - name: Tests
        run: uv run pytest --cov=backend --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (clean)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v -E '\.env\.example$'; then
            echo "::error::.env file is tracked in git — secrets must never be committed (I5)"; exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pip-audit (locked runtime deps)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high
